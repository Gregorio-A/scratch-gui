name: Trigger TextWarp Desktop

on:
  workflow_run:
    workflows:
      - Publish TextWarp Web
    types:
      - completed

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    env:
      DESKTOP_TOKEN: ${{ secrets.TEXTWARP_DESKTOP_TOKEN }}
    steps:
      - name: Report disabled automatic Desktop builds
        if: env.DESKTOP_TOKEN == ''
        run: echo 'TEXTWARP_DESKTOP_TOKEN is not configured; the Web deploy remains complete and Desktop can still be run manually.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the matching Desktop version
        if: env.DESKTOP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DESKTOP_TOKEN }}
          SCRATCH_GUI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh workflow run desktop.yml
          --repo Gregorio-A/turbowarp-TextWarp
          --ref Desktop-main
          --field scratch_gui_ref="${SCRATCH_GUI_SHA}"
